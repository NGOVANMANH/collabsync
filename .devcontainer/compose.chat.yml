name: collabsync

services:
  chat-service-db:
    image: postgres:latest
    container_name: chat-service-db
    environment:
      POSTGRES_USER: ${CHAT_DB_USER}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD}
      POSTGRES_DB: ${CHAT_DB_DB}
    ports:
      - "${CHAT_DB_PORT}:5432"
    volumes:
      - chat-service-db-data:/var/lib/postgresql/data
    networks:
      - collabsync-network
