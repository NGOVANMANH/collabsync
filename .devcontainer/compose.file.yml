name: collabsync
services:
  file-service-db:
    image: postgres:latest
    container_name: file-service-db
    environment:
      - POSTGRES_USER=${FILE_DB_USER}
      - POSTGRES_PASSWORD=${FILE_DB_PASSWORD}
      - POSTGRES_DB=${FILE_DB_DB}
    ports:
      - "${FILE_DB_PORT}:5432"
    volumes:
      - file-service-db-data:/var/lib/postgresql/data
    networks:
      - collabsync-network
